<!doctype html>
<html lang="en" data-page="observer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https:; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SolarDash</title>
<link rel="stylesheet" href="style.css" integrity="sha384-RcpoQMOvHFbx1DaIbZP3YYk++5UkPdYmVGpYuhTMXRlNJVWyCoUoAEOKwoPXdGHn">
<script src="app.js" defer integrity="sha384-UW+BntYI3t7y9bvB5WCwphNFFFUqOkrwKxNy5crsmvcrVSpAtBehXyeK9pq8ikCV"></script>
</head>
<body>
<main>
  <header>
    <h1 id="plant-name">SolarDash</h1>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p id="status-note" class="status-note" hidden></p>
  </header>

  <p id="loading" class="loading" data-t="loading">Loading…</p>

  <section id="error" class="error" role="alert" hidden>
    <h2 data-t="errorTitle">Cannot show the plant</h2>
    <p id="error-text"></p>
    <button id="retry" type="button" data-t="retry">Try again</button>
  </section>

  <div id="content" hidden>
    <section id="problems-box" class="problems" hidden>
      <h2 data-t="problemsTitle">Messages</h2>
      <ul id="problems"></ul>
    </section>

    <section class="flow-box">
      <svg id="flow" class="flow-svg" viewBox="0 0 420 450" role="img" aria-labelledby="flow-title">
        <title id="flow-title" data-t="flowTitle">Energy flow now</title>
        <g><path id="f-pv" class="flow" d="M210 138 L210 215"/></g>
        <g><path id="f-grid" class="flow" d="M135 215 L210 215"/></g>
        <g><path id="f-bat" class="flow" d="M210 287 L210 215"/></g>
        <g><path id="f-home" class="flow" d="M210 215 L285 215"/></g>
        <circle class="hub" cx="210" cy="215" r="6"/>

        <g id="n-pv" class="node solar" role="img">
          <circle cx="210" cy="75" r="63"/>
          <text class="label" x="210" y="57" text-anchor="middle" data-t="solar">Solar</text>
          <text id="v-pv" class="value" x="210" y="91" text-anchor="middle">–</text>
        </g>
        <g id="n-grid" class="node grid" role="img">
          <circle cx="72" cy="215" r="63"/>
          <text class="label" x="72" y="197" text-anchor="middle" data-t="grid">Grid</text>
          <text id="v-grid" class="value" x="72" y="231" text-anchor="middle">–</text>
          <text id="s-grid" class="sub" x="72" y="302" text-anchor="middle"></text>
        </g>
        <g id="n-home" class="node home" role="img">
          <circle cx="348" cy="215" r="63"/>
          <text class="label" x="348" y="197" text-anchor="middle" data-t="home">Home</text>
          <text id="v-home" class="value" x="348" y="231" text-anchor="middle">–</text>
        </g>
        <!-- As in the app: at the bottom, the charge as a ring around the circle and in % inside it. -->
        <g id="n-bat" class="node battery" role="img">
          <circle cx="210" cy="350" r="63"/>
          <circle id="soc-ring" class="soc-ring" cx="210" cy="350" r="63" transform="rotate(-90 210 350)" stroke-dasharray="0 396"/>
          <text class="label" x="210" y="324" text-anchor="middle" data-t="battery">Battery</text>
          <text id="v-bat" class="value" x="210" y="355" text-anchor="middle">–</text>
          <text id="soc" class="soc" x="210" y="384" text-anchor="middle"></text>
          <text id="s-bat" class="sub" x="210" y="440" text-anchor="middle"></text>
        </g>
      </svg>
    </section>

    <section class="totals">
      <h2 id="totals-title" data-t="todayTitle">Today</h2>
      <dl>
        <div class="total solar"><dt data-t="solar">Solar</dt><dd id="t-pv">–</dd></div>
        <div class="total home"><dt data-t="consumption">Consumption</dt><dd id="t-load">–</dd></div>
        <div class="total grid" id="t-export-row"><dt data-t="export">Export</dt><dd id="t-export">–</dd></div>
        <div class="total import" id="t-import-row"><dt data-t="import">Import</dt><dd id="t-import">–</dd></div>
      </dl>
    </section>

    <section id="history" class="history" aria-labelledby="history-title">
      <h2 id="history-title" data-t="historyTitle">History</h2>
      <div id="periods" class="periods" role="group" data-t-label="periods">
        <button type="button" data-period="day" data-t="period_day">Day</button>
        <button type="button" data-period="week" data-t="period_week">Week</button>
        <button type="button" data-period="month" data-t="period_month">Month</button>
        <button type="button" data-period="year" data-t="period_year">Year</button>
        <button type="button" data-period="lifetime" data-t="period_lifetime">Lifetime</button>
      </div>
      <div class="range-nav">
        <button id="prev" type="button" class="icon-button" data-t-label="previous">‹</button>
        <p id="range-label" class="range-label" aria-live="polite"></p>
        <button id="next" type="button" class="icon-button" data-t-label="next">›</button>
      </div>
      <div class="range-actions">
        <button id="to-today" type="button" class="secondary" data-t="toToday">Today</button>
        <button id="table-toggle" type="button" class="secondary" data-t="showTable">Show table</button>
      </div>
      <ul id="legend" class="chips"></ul>
      <div id="readout" class="readout" aria-live="polite" hidden></div>
      <p id="history-state" class="history-state" hidden></p>
      <div id="chart-wrap" class="chart-wrap" hidden>
        <svg id="chart" class="chart" role="img" tabindex="0" aria-labelledby="chart-title"><title id="chart-title" data-t="chartA11y">History chart</title></svg>
      </div>
      <div id="history-table" class="history-table" hidden></div>
      <div id="chart-tools" class="chart-tools" hidden>
        <p class="note" data-t="chartHint"></p>
        <button id="zoom-reset" type="button" class="secondary" data-t="zoomReset" hidden>Reset zoom</button>
      </div>
      <p id="sign-note" class="note" data-t="chartNote"></p>
      <h3 data-t="totals">Totals</h3>
      <dl id="period-totals" class="rows"></dl>
    </section>

    <section id="alarms" class="alarms" aria-labelledby="alarms-title">
      <h2 id="alarms-title" data-t="alarmsTitle">Faults</h2>
      <p id="alarms-loading" class="note" data-t="loading">Loading…</p>
      <h3 data-t="logActive">Active</h3>
      <ul id="alarms-active" class="events"></ul>
      <h3 data-t="logPast">History</h3>
      <ul id="alarms-past" class="events"></ul>
      <button id="alarms-more" type="button" class="secondary" data-t="logMore" hidden>Show older entries</button>
    </section>
  </div>

  <dialog id="picker" class="picker" aria-labelledby="picker-title">
    <h2 id="picker-title" data-t="pickerTitle">Add channels</h2>
    <div id="picker-devices" class="chips" role="group" data-t-label="pickerDevices"></div>
    <p id="picker-search-row" class="picker-search"><label><span data-t="pickerSearch">Search</span> <input id="picker-search" type="search" autocomplete="off"></label></p>
    <p id="picker-status" class="note"></p>
    <div id="picker-list" class="picker-list"></div>
    <p id="picker-refused" class="refused" role="alert" hidden></p>
    <div class="dialog-buttons">
      <button id="picker-cancel" type="button" class="secondary" data-t="cancel">Cancel</button>
      <button id="picker-add" type="button" data-t="add">Add</button>
    </div>
  </dialog>

  <footer>
    <a id="open-app" class="button" href="solardash://observe" data-t="openApp">Open in SolarDash</a>
    <p class="note" data-t="privacy"></p>
  </footer>
</main>
</body>
</html>
