[project]
name = "solar-dashboard"
version = "0.1.0"
description = "Desktop dashboard for solar plants: live energy flow, history, devices"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.1", "pyqtgraph==0.13.7"]

[project.optional-dependencies]
test = ["pytest==8.3.4"]

[project.scripts]
solar-dashboard = "solar_dashboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solar_dashboard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
